<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — MOVA</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/auth.css"></head><body><div class="site-background"><main class="auth-shell"><a class="auth-brand" href="../index.html"><span>✦</span> MOVA</a><section class="auth-card"><p class="auth-eyebrow">YOUR INDIA. YOUR WAY.</p><h1>WELCOME <span>BACK.</span></h1><p class="auth-intro">Sign in to plan trips, save places and join the MOVA community.</p><div class="auth-mode-row"><button type="button" class="auth-mode is-active" data-auth-mode="login">SIGN IN</button><button type="button" class="auth-mode" data-auth-mode="register">CREATE ACCOUNT</button></div><p class="auth-message" data-auth-message hidden role="alert"></p><form id="auth-form"><input type="hidden" name="authMode" value="login"><label class="auth-field" hidden>DISPLAY NAME<input name="displayName" autocomplete="name" placeholder="Your name"></label><label class="auth-field">EMAIL ADDRESS<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="auth-field">PASSWORD<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></label><label class="auth-field" hidden>CONFIRM PASSWORD<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat password"></label><button class="auth-submit" type="submit">SIGN IN</button><button class="auth-text-button" type="button" data-password-reset>FORGOT PASSWORD?</button></form><div class="auth-divider"><span>OR</span></div><button class="auth-google" type="button" data-google-sign-in>CONTINUE WITH GOOGLE</button><p class="auth-footnote">Want to look around first? <a href="../pages/discover.html">Explore India</a></p></section></main></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script></body></html>
